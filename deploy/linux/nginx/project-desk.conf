server {
    listen 80;
    server_name project-desk.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name project-desk.example.internal;
    root /var/www/project-desk/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/project-desk.example.internal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/project-desk.example.internal/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\. {
        deny all;
    }
}
